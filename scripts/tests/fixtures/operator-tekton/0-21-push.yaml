# yamllint disable rule:line-length rule:document-start
# submariner-operator 5def92dc:.tekton/submariner-operator-0-21-push.yaml, up to namespace (wrapped, lacks go.sum and other inputs)
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/submariner-io/submariner-operator?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch == "release-0.21" &&
      (".tekton/submariner-operator-0-21-pull-request.yaml".pathChanged() ||
      ".tekton/submariner-operator-0-21-push.yaml".pathChanged() ||
      "go.mod".pathChanged() ||
      "api/***".pathChanged() ||
      "package/***".pathChanged() ||
      "internal/***".pathChanged() ||
      "pkg/***".pathChanged())
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: submariner-0-21
    appstudio.openshift.io/component: submariner-operator-0-21
    pipelines.appstudio.openshift.io/type: build
  name: submariner-operator-0-21-on-push
  namespace: submariner-tenant
